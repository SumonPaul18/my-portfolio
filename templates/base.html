<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- Devicon for Tech Logos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
        
        /* Smooth transitions */
        .tilt-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold tracking-tighter">SP<span class="text-blue-500">.</span></a>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-400">
                <a href="#hero" class="hover:text-blue-400 transition">Hero</a>
                <a href="#about" class="hover:text-blue-400 transition">About</a>
                <a href="#skills" class="hover:text-blue-400 transition">Skills</a>
                <a href="#experience" class="hover:text-blue-400 transition">Experience</a>
                <a href="#projects" class="hover:text-blue-400 transition">Projects</a>
                <a href="#blog" class="hover:text-blue-400 transition">Blog</a>
                <a href="#contact" class="hover:text-blue-400 transition">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-center text-slate-500 text-sm">
        <p>&copy; 2026 {{ config.name }} | Built with Flask & Tailwind</p>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script>
        // Initialize Animations
        AOS.init({
            duration: 800,
            once: true,
            offset: 100,
            easing: 'ease-out-cubic'
        });
        
        // Initialize Tilt Effect
        VanillaTilt.init(document.querySelectorAll(".tilt-card"), {
            max: 8,
            speed: 400,
            glare: true,
            "max-glare": 0.15,
        });
    </script>
</body>
</html>
